<!doctype html><meta charset="utf-8"><pre id="o"></pre>
<script type="module">
import { generateMap } from '../js/world/mapgen.js';
import { Game } from '../js/sim/game.js';
const o = document.getElementById('o');
try {
const m = await generateMap(()=>{});
const g = new Game(m);
let t0 = performance.now();
g.newGame(new URLSearchParams(location.search).get('tag') || 'FRA');
const out = [`init ${(performance.now()-t0)|0}ms armies=${Object.keys(g.s.armies).length} chars=${Object.keys(g.s.chars).length}`];
g.s.player = -1; // all AI
const Q = new URLSearchParams(location.search);
const days = Q.get('years') ? Math.round(+Q.get('years') * 365) : +(Q.get('days') || 730);
const start = g.s.nations.map(n => g.ownedProvinces(n.id).length);
let wars = 0, peaces = 0, aiMs = 0, maxDay = 0;
g.on('war', id => { if (g.s.wars[id] && g.s.wars[id].start === g.s.day) wars++; });
g.on('peace', () => peaces++);
const dai = g.dailyAI.bind(g); g.dailyAI = () => { const t = performance.now(); dai(); aiMs += performance.now() - t; };
t0 = performance.now();
window.__maxF=0; window.__wd=0; const wb=g.withdrawBattle.bind(g); g.withdrawBattle=(...x)=>{window.__wd++; return wb(...x);}; for (let d = 0; d < days; d++) { const td = performance.now(); g.tickDay(); maxDay = Math.max(maxDay, performance.now() - td); if (g.s.eventQueue.length) g.s.eventQueue.length = 0; window.__maxF=Math.max(window.__maxF, Object.keys(g.s.fronts).length); }
const el = performance.now()-t0;
out.push(`ticked ${days} days in ${el|0}ms (${(el/days).toFixed(2)} ms/day, AI ${(aiMs/days).toFixed(2)} ms/day, worst day ${maxDay|0}ms)`);
// border plausibility: growth relative to the start of the game
const grow = g.s.nations.filter(n => start[n.id] > 0).map(n => [n.tag, start[n.id], g.ownedProvinces(n.id).length, +(g.ownedProvinces(n.id).length / start[n.id]).toFixed(2)]).sort((a, b) => b[3] - a[3]);
const L = g.s.prov.filter(p => p.owner >= 0).length, sizes = g.s.nations.map(n => g.ownedProvinces(n.id).length).sort((a, b) => b - a);
out.push(`metrics: wars declared ${wars} peaces ${peaces} | dead ${g.s.nations.filter(n => !n.alive && start[n.id] > 0).length} | >3x start: ${grow.filter(x => x[3] > 3 && x[2] >= 30).length} (${grow.filter(x => x[3] > 3 && x[2] >= 30).map(x => x[0]).join(',') || '-'}) | >2x: ${grow.filter(x => x[3] > 2 && x[2] >= 30).length} | top5 share ${(sizes.slice(0, 5).reduce((a, b) => a + b, 0) / L * 100).toFixed(1)}%`);
out.push('growth: ' + grow.slice(0, 8).map(x => `${x[0]} ${x[1]}→${x[2]} (${x[3]}x)`).join(', ') + ' | shrank most: ' + grow.slice(-5).map(x => `${x[0]} ${x[1]}→${x[2]}`).join(', '));
out.push('wars: ' + Object.values(g.s.wars).map(w=>w.name+' '+w.score).join(' | '));
out.push('battles fought: ' + g.s.nations.reduce((t,n)=>t+n.stats.won,0));
out.push('MON: ' + JSON.stringify((()=>{const m=g.nationByTag('MON'); return m? [m.alive, g.ownedProvinces(m.id).length, g.armiesOf(m.id).length]:null})()));
out.push('AI fronts now: ' + Object.values(g.s.fronts).map(f=>g.s.nations[f.nation].tag+'>'+g.s.nations[f.enemy].tag+':'+f.armies.length+':'+f.mode).join(' ') + ' | maxFronts ' + window.__maxF + ' assaults ' + g.s.log.filter(l=>/stormed|thrown back/.test(l.text)).length + ' withdrawals ' + window.__wd + ' royalHosts ' + g.s.nations.filter(n=>n.templates.some(t=>t.name==='Royal Host')).length + ' marriages ' + g.s.nations.reduce((t,n)=>t+n.marriages.length,0)/2);
out.push('alive: ' + g.s.nations.filter(n=>n.alive).length + ' armies ' + Object.keys(g.s.armies).length);
const top = g.s.nations.filter(n=>n.alive).map(n=>[n.tag, g.ownedProvinces(n.id).length, Math.round(n.gold), Math.round(n.manpower), n.focus.done.length]).sort((a,b)=>b[1]-a[1]).slice(0,15);
out.push(JSON.stringify(top));
const A = Object.values(g.s.armies); out.push('moving ' + A.filter(a=>a.path.length).length + ' weak ' + A.filter(a=>g.armyMen(a)<g.armyMax(a)*0.45).length + ' lowmorale ' + A.filter(a=>g.armyMorale(a)<0.35).length + ' fails ' + A.reduce((t,a)=>t+(a.ai.fail||0),0) + ' sieges ' + g.s.prov.filter(p=>p.siege).length + ' occupied ' + g.s.prov.filter(p=>p.controller!==p.owner).length);
out.push(A.slice(0,8).map(a=>`${a.name}/${a.nation} men ${Math.round(g.armyMen(a))}/${g.armyMax(a)} mor ${g.armyMorale(a).toFixed(2)} path ${a.path.length} loc ${a.loc} hostile ${g.hostileToProvince(a,a.loc)} atwar ${g.atWar(a.nation)}`).join('\n'));
out.push(g.s.log.slice(0,40).map(l=>l.text).join('\n'));
o.textContent = out.join('\n');
} catch (e) { o.textContent = 'ERR ' + e.stack; }
window.done = true;
</script>
